inherit:
    - models/copy.yaml
    - wandb.yaml

model:
    n_dims: 6
    n_positions: 4096
    linear_embedding: True
    use_wpe: True
    wpe_mode: once
    use_rope: False
    rope_theta: 10000.0

training:
    task: copy
    test_len: 30
    batch_size: 64
    learning_rate: 0.0001
    train_steps: 100001
    curriculum:
        points:
            start: 2
            end: 21
            inc: 1
            interval: 1000

out_dir: ../models/ape_once_baselines/copy_fixed_loop
test_run: False

wandb:
    entity: diaozb-tsinghua-university
    project: looped-tf-ape-once-copy-fixed-loop
    name: copy_ape_once_fixed_loop
    notes: ''
    log_every_steps: 1000
