_parity_ponder_nope: &parity_ponder_nope
  name: parity_ponder_nope_seed{seed}_L{model.n_layer}_H{model.n_head}_T{trainer.ponder_n_steps}
  include: [../tasks/parity.yaml, ../models/gpt2_loop.yaml, ../trainers/ponder.yaml, ../pe/nope.yaml]
