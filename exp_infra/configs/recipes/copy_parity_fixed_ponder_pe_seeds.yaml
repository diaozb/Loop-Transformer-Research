# Full sweep for the migrated copy/parity infra.
#
# Scope: 2 tasks x 2 trainers x 4 PE modes x 3 seeds = 48 runs.
# Seeds: 17, 101, 1009.
# PE modes:
#   - nope: no positional encoding
#   - rope: rotary positional encoding
#   - wpe_once: learned absolute PE applied once before looping
#   - wpe_all: learned absolute PE applied at every loop
#
# Task/model parameters match the legacy task-specific configs:
#   - parity: n_embd=256, n_layer=1, n_head=64, test_length=40
#   - copy:   n_embd=256, n_layer=2, n_head=8,  test_length=30
name: copy_parity_fixed_ponder_pe_seeds

defaults:
  device: cuda
  logging:
    output_root: exp_infra/runs/copy_parity_fixed_ponder_pe_seeds
  eval:
    run_after_train: true
    after_train_checkpoint: best

_parity_arch: &parity_arch
  n_embd: 256
  n_layer: 1
  n_head: 64

_copy_arch: &copy_arch
  n_embd: 256
  n_layer: 2
  n_head: 8

_parity_fixed_nope: &parity_fixed_nope
  name: parity_fixed_loop_nope_seed{seed}_L{model.n_layer}_H{model.n_head}
  include: [../tasks/parity.yaml, ../models/gpt2_loop.yaml, ../trainers/fixed_loop.yaml, ../pe/nope.yaml]
  model: *parity_arch
  tags: [parity, fixed_loop, nope]

_parity_fixed_rope: &parity_fixed_rope
  name: parity_fixed_loop_rope_seed{seed}_L{model.n_layer}_H{model.n_head}
  include: [../tasks/parity.yaml, ../models/gpt2_loop.yaml, ../trainers/fixed_loop.yaml, ../pe/rope.yaml]
  model: *parity_arch
  tags: [parity, fixed_loop, rope]

_parity_fixed_wpe_once: &parity_fixed_wpe_once
  name: parity_fixed_loop_wpe_once_seed{seed}_L{model.n_layer}_H{model.n_head}
  include: [../tasks/parity.yaml, ../models/gpt2_loop.yaml, ../trainers/fixed_loop.yaml, ../pe/wpe_once.yaml]
  model: *parity_arch
  tags: [parity, fixed_loop, wpe_once]

_parity_fixed_wpe_all: &parity_fixed_wpe_all
